name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Skip the image build/push entirely on PRs; run it on main only after
# the verify gate passes. On PRs, verify runs standalone.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (fmt / lint / types / build / test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check (oxfmt)
        run: pnpm exec oxfmt --check src vite.config.ts vitest.config.ts

      - name: Lint (oxlint)
        run: pnpm exec oxlint --vue-plugin .

      - name: Types (tsc)
        run: pnpm exec tsc -b --noEmit

      - name: Build (vite)
        run: pnpm exec vite build

      - name: Test (vitest)
        run: pnpm exec vitest run

  build-and-push:
    name: Build and push image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version (semver from package.json)
        id: meta
        run: |
          echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "semver=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (<version>)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          build-args: |
            VITE_APP_VERSION=${{ steps.meta.outputs.semver }}
            VITE_SITE_URL=https://bundlestate.dimasbaguspm.dev

      - name: Build and push image (latest / Nightly)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            VITE_APP_VERSION=Nightly
            VITE_SITE_URL=https://bundlestate.dimasbaguspm.dev

      - name: Trigger deploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        if: env.DEPLOY_WEBHOOK_URL != ''
        run: curl -fsS -X POST "$DEPLOY_WEBHOOK_URL"
